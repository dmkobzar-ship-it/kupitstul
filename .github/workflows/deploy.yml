# KupitStul.ru — CI/CD Pipeline
# Standard pattern: build image on CI, push to GHCR, server only pulls (~10s vs 150s).
#
# ── Required GitHub Secrets ─────────────────────────────────────────────────
#   DEPLOY_HOST      — production server IP (141.98.190.172)
#   DEPLOY_USER      — SSH user (root)
#   DEPLOY_SSH_KEY   — SSH private key (ed25519)
#   GHCR_TOKEN       — GitHub PAT with read:packages scope (for server docker pull)
# ────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dmkobzar-ship-it/kupitstul

jobs:
  # ============================================================
  # 1. Build Docker image on GitHub Actions runner (fast + cached)
  # ============================================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (with GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          # GitHub Actions cache — subsequent builds only rebuild changed layers
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2. Deploy to production: pull pre-built image, restart app only
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          envs: GHCR_TOKEN,ACTOR,IMAGE
          script: |
            set -e

            # 1. Pull pre-built image from GHCR (~10s vs 150s local build)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin 2>/dev/null
            docker pull "$IMAGE:latest"
            docker tag "$IMAGE:latest" kupitstul_app:latest

            # 2. Update config files (nginx, docker-compose, prisma schema etc.)
            cd /home/deploy/kupitstul
            git pull origin main

            # 3. Restart ONLY the app container — postgres & redis stay up (zero downtime)
            docker ps -aq \
              --filter 'label=com.docker.compose.project=kupitstul' \
              --filter 'label=com.docker.compose.service=app' \
              | xargs -r docker rm -f 2>/dev/null || true
            docker-compose up --no-build -d app
            docker restart kupitstul_nginx_1 2>/dev/null || true

            # 4. Wait for healthy response (up to 60s)
            echo "Waiting for healthy response..."
            for i in $(seq 1 30); do
              CODE=$(curl -so /dev/null -w '%{http_code}' --max-time 5 https://kupitstul.ru/ 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "Deploy OK: HTTP $CODE after $((i*2))s"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: site did not return 200 in 60s" >&2
            docker logs --tail=20 "$(docker ps -q --filter 'label=com.docker.compose.service=app' | head -1)" 2>/dev/null || true
            exit 1

